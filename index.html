<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f6f7fb">
  <title>Talk Manager</title>
  <style>
    :root{font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#202534;background:#f6f7fb;--ink:#202534;--muted:#707b8e;--line:#e5e8ef;--paper:#fff;--accent:#5b68d8;--soft:#eff0ff;--green:#167d59;--red:#b84444;--radius:14px}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}.shell{min-height:100vh;display:grid;grid-template-columns:240px 1fr}.side{background:white;border-right:1px solid var(--line);padding:22px 15px;display:flex;flex-direction:column;gap:24px}.brand{display:flex;align-items:center;gap:11px;padding:0 7px;font-weight:700}.mark{background:var(--accent);color:white;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800}.brand small{display:block;color:var(--muted);font-weight:400;font-size:11px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;border-radius:9px;text-align:left;padding:10px 12px;color:#515b6c}.nav button.active,.nav button:hover{background:var(--soft);color:var(--accent)}.side-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:14px;color:var(--muted);font-size:12px}.main{min-width:0}.top{height:68px;position:sticky;top:0;background:#ffffffed;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 32px;z-index:2}.crumb{color:var(--muted);font-size:13px}.content{max-width:1280px;margin:auto;padding:32px}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:24px}.head h1{font-size:26px;letter-spacing:-.6px;margin:0 0 4px}.head p{margin:0;color:var(--muted);font-size:13px}.card{background:white;border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 8px 25px #1c29410a}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px;margin-bottom:17px}.stat{padding:18px}.stat label{color:var(--muted);font-size:12px}.stat strong{display:block;font-size:26px;margin-top:6px}.section{margin-bottom:17px}.section-title{padding:16px 18px;border-bottom:1px solid var(--line);font-weight:650}.pad{padding:18px}.muted{color:var(--muted)}.empty{padding:42px 25px;text-align:center}.empty h2{font-size:17px;margin:0 0 8px}.empty p{max-width:540px;margin:0 auto 18px;color:var(--muted);font-size:13px}.btn{border:1px solid var(--line);background:white;border-radius:9px;padding:9px 13px;color:#394253;font-weight:550}.btn.primary{color:white;background:var(--accent);border-color:var(--accent)}.btn.danger{color:var(--red)}.btn:disabled{opacity:.5;cursor:not-allowed}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.grow{flex:1}.field{border:1px solid var(--line);border-radius:9px;padding:10px 11px;background:white;color:var(--ink);min-width:0}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left}th{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:#7d8797;padding:12px 16px;border-bottom:1px solid var(--line)}td{padding:13px 16px;border-bottom:1px solid #eef0f4;font-size:13px}tr:last-child td{border:0}.badge{display:inline-block;border-radius:99px;background:#f1f2f6;padding:4px 8px;font-size:11px;color:#5b6473}.status{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:#a8afbb}.dot.ok{background:#1c9a6a}.dot.err{background:#c44d4d}.form{display:grid;gap:13px;max-width:480px}.form label{display:grid;gap:5px;font-size:12px;font-weight:600;color:#505b6c}.form input,.form textarea,.form select{border:1px solid var(--line);border-radius:9px;padding:10px 11px;background:white}.form textarea{min-height:115px;resize:vertical}.form small{font-weight:400;color:var(--muted)}.note{background:#f2f3ff;border:1px solid #e3e5ff;color:#4854a8;border-radius:10px;padding:13px 15px;font-size:12px;margin-bottom:16px}.error{background:#fff1f1;border:1px solid #f3d7d7;color:#993e3e;border-radius:10px;padding:12px 14px;font-size:13px;margin-bottom:14px}.success{background:#eef9f4;border:1px solid #d7efe3;color:#176847;border-radius:10px;padding:12px 14px;font-size:13px;margin-bottom:14px}.modal-back{position:fixed;inset:0;background:#11182766;display:grid;place-items:center;padding:18px;z-index:5}.modal{width:min(540px,100%);background:white;border-radius:15px;box-shadow:0 20px 70px #121a2b44;overflow:hidden}.modal-head,.modal-foot{padding:15px 19px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.modal-foot{border:0;border-top:1px solid var(--line);justify-content:flex-end;gap:8px}.modal-body{padding:18px;display:grid;gap:13px}.hidden{display:none!important}.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}.auth-card{width:min(460px,100%);padding:26px}.auth-card h1{margin:0 0 4px;font-size:23px}.auth-card>p{color:var(--muted);font-size:13px;margin:0 0 20px}.auth-card .mark{margin-bottom:16px}.actions{display:flex;gap:7px}.mobile{display:none}
    @keyframes rise-in{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}@keyframes soft-in{from{opacity:0}to{opacity:1}}.auth-card,.content>.head,.card{animation:rise-in .42s cubic-bezier(.2,.7,.2,1) both}.card:nth-child(2){animation-delay:.04s}.card:nth-child(3){animation-delay:.08s}.btn{transition:transform .16s ease,box-shadow .16s ease,background-color .16s ease,border-color .16s ease}.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 5px 13px #25314b16}.nav button{transition:background-color .18s ease,color .18s ease,transform .18s ease}.nav button:hover{transform:translateX(2px)}.card{transition:box-shadow .2s ease,border-color .2s ease}.stat:hover,.section:hover{box-shadow:0 12px 30px #1c294114;border-color:#d8dceb}.field:focus,input:focus,textarea:focus,select:focus{outline:3px solid #818cf833;border-color:#818cf8}.modal-back{animation:soft-in .16s ease both}.modal{animation:rise-in .2s ease both}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
    @media(max-width:850px){.shell{grid-template-columns:190px 1fr}.content{padding:24px 18px}.top{padding:0 18px}}@media(max-width:650px){.shell{display:block}.side{display:none;position:fixed;inset:0 auto 0 0;width:250px;z-index:4;box-shadow:0 10px 30px #10182833}.side.open{display:flex}.mobile{display:inline-flex}.stats{grid-template-columns:1fr}.head{display:block}.head .btn{margin-top:14px}.top{height:60px}}
  </style>
  <script src="./config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3"></script>
</head>
<body>
  <div id="app"></div><div id="modal"></div>
  <script>
  (()=>{
    const KEY='talkmanager.supabase.config.v1';let db=null,user=null,servers=[],serverId='',campaigns=[],view='Overview',busy=false;
    const app=document.querySelector('#app'),modal=document.querySelector('#modal');
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const config=()=>{const shared=window.TALK_MANAGER_CONFIG||{};if(shared.url&&(shared.publishableKey||shared.key))return {url:shared.url,key:shared.publishableKey||shared.key};try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch{return {}}};
    const message=(text,type='error')=>{document.querySelectorAll('.flash').forEach(n=>n.remove());const n=document.createElement('div');n.className=`flash ${type}`;n.textContent=text;app.prepend(n)};
    const makeClient=()=>{const c=config();if(!c.url||!c.key||!window.supabase?.createClient)return null;try{return window.supabase.createClient(c.url,c.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}})}catch{return null}};
    function configuration(){app.innerHTML=`<main class="auth-wrap"><section class="card auth-card"><div class="mark">T</div><h1>Connect Talk Manager</h1><p>Use your Supabase project to authenticate users and store real campaign data. No sample data is shown.</p><div id="flash"></div><form class="form" id="configForm"><label>Supabase project URL<input name="url" type="url" required placeholder="https://your-project.supabase.co" value="${esc(config().url||'')}"></label><label>Supabase publishable key<input name="key" required autocomplete="off" placeholder="sb_publishable_…" value="${esc(config().key||'')}"><small>This key is safe for browser use when your tables have correct RLS policies. Never enter a service role key here.</small></label><button class="btn primary">Connect project</button></form><p style="margin:17px 0 0">Find these in your Supabase project’s Connect dialog or Settings → API Keys. Apply the included SQL migration before signing in.</p><p><a href="https://supabase.com/dashboard/projects" target="_blank" rel="noreferrer">Open Supabase dashboard</a></p></section></main>`;
      document.querySelector('#configForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),url=String(f.get('url')).trim().replace(/\/$/,''),key=String(f.get('key')).trim();if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(url)){document.querySelector('#flash').innerHTML='<div class="error">Enter the Project URL shown by Supabase.</div>';return}localStorage.setItem(KEY,JSON.stringify({url,key}));db=makeClient();if(!db){document.querySelector('#flash').innerHTML='<div class="error">Could not initialize the Supabase client.</div>';return}boot()};}
    function authScreen(){app.innerHTML=`<main class="auth-wrap"><section class="card auth-card"><div class="mark">T</div><h1>Sign in to Talk Manager</h1><p>Use an account enabled in your Supabase project.</p><div id="flash"></div><form class="form" id="authForm"><label>Email<input name="email" type="email" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="btn primary" id="signin">Sign in</button><button class="btn" id="signup" type="button">Create account</button></form><p style="margin-top:16px"><button class="btn" id="changeConfig">Change Supabase project</button></p></section></main>`;
      const form=document.querySelector('#authForm');form.onsubmit=async e=>{e.preventDefault();const f=new FormData(form);try{const {error}=await db.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});if(error)throw error;await boot()}catch(err){document.querySelector('#flash').innerHTML=`<div class="error">${esc(err.message||'Sign-in failed')}</div>`}};
      document.querySelector('#signup').onclick=async()=>{const email=form.email.value,password=form.password.value;if(!email||!password){document.querySelector('#flash').innerHTML='<div class="error">Enter an email and password first.</div>';return}const {error}=await db.auth.signUp({email,password});document.querySelector('#flash').innerHTML=error?`<div class="error">${esc(error.message)}</div>`:'<div class="success">Account request sent. Check your email if confirmation is enabled.</div>'};
      document.querySelector('#changeConfig').onclick=()=>{db.auth.signOut();localStorage.removeItem(KEY);configuration()};}
    async function boot(){db=makeClient();if(!db){configuration();return}const {data:{session},error}=await db.auth.getSession();if(error){configuration();return}user=session?.user||null;if(!user){authScreen();return}await loadServers();}
    async function loadServers(){const {data:members,error}=await db.from('server_memberships').select('server_id,app_role').eq('user_id',user.id);if(error){workspaceError(error);return}if(!members?.length){servers=[];workspace();return}const {data:serverRows,error:serverError}=await db.from('servers').select('id,name,discord_guild_id').in('id',members.map(m=>m.server_id));if(serverError){workspaceError(serverError);return}servers=(serverRows||[]).map(s=>({...s,app_role:members.find(m=>m.server_id===s.id)?.app_role}));serverId=servers.some(s=>s.id===serverId)?serverId:(servers[0]?.id||'');if(serverId)await loadCampaigns();else workspace();}
    async function loadCampaigns(){const {data,error}=await db.from('campaigns').select('id,title,status,body,scheduled_at,timezone,created_at,updated_at').eq('server_id',serverId).order('updated_at',{ascending:false});if(error){workspaceError(error);return}campaigns=data||[];workspace()}
    function workspaceError(error){app.innerHTML=`<main class="auth-wrap"><section class="card auth-card"><div class="mark">T</div><h1>Could not load workspace</h1><p>${esc(error.message||'Supabase returned an error.')}</p><p>Confirm the Talk Manager migration is applied, Data API table grants are enabled, and this account has a server membership.</p><button class="btn" id="retry">Retry</button> <button class="btn" id="out">Sign out</button></section></main>`;document.querySelector('#retry').onclick=()=>loadServers();document.querySelector('#out').onclick=()=>db.auth.signOut().then(authScreen)}
    function nav(){return `<nav class="nav">${['Overview','Campaigns','Discord bot','Settings'].map(n=>`<button class="${view===n?'active':''}" data-view="${n}">${n==='Discord bot'?'⚙ ':''}${n}</button>`).join('')}</nav>`}
    function workspace(){
      const noServer=!servers.length;
      app.innerHTML=`<div class="shell"><aside class="side" id="side"><div class="brand"><div class="mark">T</div><span>Talk Manager<small>Community workspace</small></span></div>${noServer?'':`<label class="muted" style="font-size:11px">SERVER<select class="field" id="serverSelect" style="width:100%;margin-top:5px">${servers.map(s=>`<option value="${esc(s.id)}" ${s.id===serverId?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label>`}${nav()}<div class="side-foot"><div class="status"><i class="dot ok"></i> Supabase connected</div><div style="margin-top:8px;overflow-wrap:anywhere">${esc(user.email)}</div><button class="btn" id="signout" style="margin-top:10px">Sign out</button></div></aside><main class="main"><header class="top"><div class="row"><button class="btn mobile" id="menu">Menu</button><span class="crumb">Talk / <b>${esc(view)}</b></span></div><div class="status"><i class="dot ok"></i> Connected</div></header><section class="content">${noServer?emptyServer():view==='Overview'?overview():view==='Campaigns'?campaignPage():view==='Discord bot'?botPage():settingsPage()}</section></main></div>`;
      document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;workspace()});document.querySelector('#signout').onclick=async()=>{await db.auth.signOut();user=null;authScreen()};document.querySelector('#menu').onclick=()=>document.querySelector('#side').classList.toggle('open');const select=document.querySelector('#serverSelect');if(select)select.onchange=async()=>{serverId=select.value;await loadCampaigns()};wirePage();}
    function emptyServer(){return `<div class="head"><div><h1>Connect a Discord server</h1><p>Your account is authenticated. No server memberships were found.</p></div></div><div class="card empty"><h2>No server data is available</h2><p>Install the Talk Manager Discord bot and complete the trusted server setup flow. The bot backend must verify your Discord permissions before creating the server membership. Talk Manager will show that server here after setup.</p><span class="badge">Waiting for bot setup</span></div>`}
    function overview(){const drafts=campaigns.filter(c=>c.status==='draft').length,scheduled=campaigns.filter(c=>c.status==='scheduled').length;return `<div class="head"><div><h1>Workspace overview</h1><p>Live records from your selected Discord server.</p></div><button class="btn primary" data-new>New campaign</button></div><div class="stats">${[["Campaigns",campaigns.length],["Drafts",drafts],["Scheduled",scheduled]].map(([l,n])=>`<article class="card stat"><label>${l}</label><strong>${n}</strong></article>`).join('')}</div><div class="card section"><div class="section-title">Recent campaigns</div>${campaigns.length?campaignTable(campaigns.slice(0,6)):`<div class="empty"><h2>No campaigns yet</h2><p>This server has no campaign records in Supabase.</p><button class="btn primary" data-new>Create campaign</button></div>`}</div><div class="card section"><div class="section-title">Connections</div><div class="pad"><div class="status"><i class="dot ok"></i> Supabase database and authentication are connected</div><div class="status" style="margin-top:11px"><i class="dot"></i> Discord bot is not configured in this dashboard</div></div></div>`}
    function campaignPage(){return `<div class="head"><div><h1>Campaigns</h1><p>Stored in Supabase for ${esc(servers.find(s=>s.id===serverId)?.name||'your server')}.</p></div><button class="btn primary" data-new>New campaign</button></div><div class="card section">${campaigns.length?campaignTable(campaigns):`<div class="empty"><h2>No campaigns</h2><p>Create a campaign record for this server. Scheduling and publishing will become available after the worker and provider integrations are installed.</p><button class="btn primary" data-new>Create campaign</button></div>`}</div>`}
    function campaignTable(rows){return `<div class="table-wrap"><table><thead><tr><th>Campaign</th><th>Status</th><th>Updated</th><th>Actions</th></tr></thead><tbody>${rows.map(c=>`<tr><td><b>${esc(c.title)}</b><span class="muted" style="display:block;font-size:11px">${esc(c.body||'')}</span></td><td><span class="badge">${esc(c.status)}</span></td><td>${c.updated_at?new Date(c.updated_at).toLocaleString():''}</td><td><div class="actions"><button class="btn" data-edit="${esc(c.id)}">Edit</button><button class="btn danger" data-delete="${esc(c.id)}">Delete</button></div></td></tr>`).join('')}</tbody></table></div>`}
    function botPage(){return `<div class="head"><div><h1>Discord bot</h1><p>Bot credentials are managed by a server-side worker, never this browser.</p></div></div><div class="note">Do not paste a bot token into this dashboard or send it in chat. When your bot is ready, store its token as a private hosting secret and connect the worker to Supabase using a server-only key.</div><div class="card section"><div class="section-title">Integration status</div><div class="pad"><div class="status"><i class="dot"></i> Bot token: not configured</div><div class="status" style="margin-top:11px"><i class="dot"></i> Persistent Discord worker: not deployed</div><div class="status" style="margin-top:11px"><i class="dot"></i> Guild permission verification: unavailable until worker setup</div></div></div>`}
    function settingsPage(){return `<div class="head"><div><h1>Settings</h1><p>Supabase account and project connection.</p></div></div><div class="card section"><div class="section-title">Signed in</div><div class="pad">${esc(user.email)} <span class="badge">${esc(servers.find(s=>s.id===serverId)?.app_role||'authenticated')}</span></div></div><div class="card section"><div class="section-title">Project connection</div><div class="pad"><p class="muted">The Supabase Project URL and publishable key are saved in this browser only. They are not passwords; RLS policies control all data access.</p><button class="btn" id="reconfig">Change project</button></div></div>`}
    function wirePage(){document.querySelectorAll('[data-new]').forEach(b=>b.onclick=()=>editCampaign());document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editCampaign(campaigns.find(c=>c.id===b.dataset.edit)));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteCampaign(b.dataset.delete));const rc=document.querySelector('#reconfig');if(rc)rc.onclick=async()=>{await db.auth.signOut();localStorage.removeItem(KEY);user=null;configuration()}}
    function editCampaign(c){modal.innerHTML=`<div class="modal-back" id="back"><section class="modal"><header class="modal-head"><b>${c?'Edit':'New'} campaign</b><button class="btn" type="button" id="x">Close</button></header><form id="campaignForm"><div class="modal-body"><label class="form"><span>Title</span><input name="title" maxlength="120" required value="${esc(c?.title||'')}"></label><label class="form"><span>Message</span><textarea name="body" maxlength="5000">${esc(c?.body||'')}</textarea></label><label class="form"><span>Status</span><select name="status"><option value="draft">Draft</option></select><small>Only drafts are enabled. A trusted background worker must be deployed before scheduling or publishing is available.</small></label></div><footer class="modal-foot"><button type="button" class="btn" id="cancel">Cancel</button><button class="btn primary">Save to Supabase</button></footer></form></section></div>`;const close=()=>modal.replaceChildren();document.querySelector('#x').onclick=close;document.querySelector('#cancel').onclick=close;document.querySelector('#back').onclick=e=>{if(e.target.id==='back')close()};document.querySelector('#campaignForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),values={title:f.get('title'),body:f.get('body'),status:'draft',server_id:serverId,created_by:user.id,timezone:'UTC',updated_at:new Date().toISOString()};busy=true;const result=c?await db.from('campaigns').update({title:values.title,body:values.body,updated_at:values.updated_at}).eq('id',c.id).eq('server_id',serverId):await db.from('campaigns').insert(values);busy=false;if(result.error){message(result.error.message);return}close();await loadCampaigns()}}
    async function deleteCampaign(id){if(!confirm('Delete this campaign from Supabase?'))return;const {error}=await db.from('campaigns').delete().eq('id',id).eq('server_id',serverId);if(error){message(error.message);return}await loadCampaigns()}
    db=makeClient();if(!db)configuration();else boot();
  })();
  </script>
</body>
</html>
