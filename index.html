<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f8fa"><title>Talk Manager</title>
<style>
:root{--bg:#f7f8fa;--paper:#fff;--ink:#20262e;--muted:#77818d;--line:#e7eaee;--accent:#5b68d8;--accent-soft:#eff0ff;--green:#16835d;--green-soft:#e8f6ef;--amber:#9a6b12;--amber-soft:#fbf3df;--red:#bd4d4d;--shadow:0 8px 24px #2330440b;--radius:12px;font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #9aa3f355;outline-offset:2px}.shell{min-height:100vh;display:grid;grid-template-columns:244px 1fr}.sidebar{background:#fff;border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:24px}.brand{display:flex;align-items:center;gap:11px;padding:0 8px}.logo{width:32px;height:32px;background:var(--accent);border-radius:9px;display:grid;place-items:center;color:white;font-weight:800;font-size:16px}.brand b{font-size:15px;letter-spacing:-.3px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:1px}.server{border:1px solid var(--line);border-radius:10px;padding:11px;display:flex;align-items:center;gap:10px}.server-icon{width:31px;height:31px;border-radius:9px;background:#dce2f7;color:#4657a6;display:grid;place-items:center;font-weight:700}.server span{flex:1}.server strong{display:block;font-size:13px}.server small{color:var(--muted);font-size:11px}.nav-label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#99a1aa;padding:0 10px;margin:3px 0 7px}.nav{display:grid;gap:3px}.nav button{border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:8px;color:#56616d;display:flex;align-items:center;gap:11px;font-size:13px}.nav button:hover{background:#f6f7f9;color:var(--ink)}.nav button.active{color:var(--accent);background:var(--accent-soft);font-weight:600}.ico{width:17px;text-align:center;font-size:15px;opacity:.83}.side-bottom{margin-top:auto;border-top:1px solid var(--line);padding-top:14px}.user{display:flex;gap:10px;align-items:center;padding:8px}.avatar{width:30px;height:30px;border-radius:50%;background:#f0e7dd;color:#895f3e;display:grid;place-items:center;font-weight:700}.user strong{font-size:12px;display:block}.user small{color:var(--muted);font-size:11px}.main{min-width:0}.topbar{height:68px;background:#ffffffd9;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;position:sticky;top:0;z-index:5;backdrop-filter:blur(12px)}.crumb{color:var(--muted);font-size:12px}.crumb b{color:var(--ink);font-weight:600}.top-right{display:flex;align-items:center;gap:12px}.demo{font-size:11px;color:#805d13;background:var(--amber-soft);padding:5px 9px;border-radius:20px}.icon-button,.btn{border:1px solid var(--line);background:#fff;border-radius:8px;color:#4f5964;padding:8px 11px}.content{max-width:1320px;margin:auto;padding:32px 34px 60px}.heading{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px}.heading h1{font-size:25px;letter-spacing:-.7px;margin:0 0 5px}.heading p{margin:0;color:var(--muted);font-size:13px}.btn.primary{background:var(--accent);border-color:var(--accent);color:white;font-weight:600}.btn:hover{filter:brightness(.98);box-shadow:0 2px 8px #15223812}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.stat{padding:17px 18px}.stat-label{color:var(--muted);font-size:12px}.stat-value{font-size:25px;font-weight:650;letter-spacing:-.7px;margin:8px 0 5px}.stat-note{font-size:11px;color:var(--muted)}.stat-note .up{color:var(--green);font-weight:600}.row{grid-template-columns:1.45fr 1fr;margin-bottom:17px}.card-head{padding:17px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.card-head h2{font-size:14px;margin:0;font-weight:650}.card-head small{color:var(--muted);font-size:11px}.chart-wrap{padding:18px;height:240px}.chart{width:100%;height:100%;overflow:visible}.axis{stroke:#edf0f3;stroke-width:1}.line{fill:none;stroke:var(--accent);stroke-width:2.6;stroke-linecap:round}.area{fill:url(#fade)}.chart-label{fill:#9aa2ac;font-size:10px}.activity{padding:2px 18px}.activity-item{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid #f0f1f3}.activity-item:last-child{border:0}.dot{height:8px;width:8px;border-radius:50%;margin-top:5px;background:var(--accent)}.dot.green{background:#26a878}.dot.amber{background:#d59b32}.activity-item b{font-size:12px;font-weight:600}.activity-item p{margin:2px 0 0;color:var(--muted);font-size:11px}.activity-item time{margin-left:auto;white-space:nowrap;color:#9aa2ac;font-size:10px}.status-row{padding:13px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #f0f1f3}.status-row:last-child{border:0}.status-symbol{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--green-soft);color:var(--green)}.status-row span:nth-child(2){flex:1;font-size:12px}.pill{border-radius:20px;padding:4px 8px;font-size:10px;background:var(--green-soft);color:var(--green);font-weight:600}.pill.neutral{background:#f1f3f5;color:#727d89}.lower{grid-template-columns:1fr 1fr}.empty-note{color:var(--muted);font-size:12px;padding:20px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;text-align:left}.table th{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:#8a949f;font-weight:600;padding:12px 16px;border-bottom:1px solid var(--line)}.table td{padding:13px 16px;border-bottom:1px solid #f0f1f3;font-size:12px}.table tr:last-child td{border:0}.table .sub{display:block;font-size:10px;color:var(--muted);margin-top:2px}.toolbar{display:flex;gap:8px}.field{border:1px solid var(--line);background:white;border-radius:8px;padding:8px 10px;color:var(--ink)}.search{width:220px}.banner{background:#f2f3ff;border:1px solid #e1e3ff;border-radius:10px;padding:13px 15px;color:#4d58a6;font-size:12px;margin-bottom:18px}.blank{min-height:260px;display:grid;place-items:center;text-align:center;padding:35px}.blank h3{margin:0 0 6px;font-size:15px}.blank p{color:var(--muted);max-width:410px;font-size:12px;margin:0 0 16px}.member{display:flex;align-items:center;gap:9px}.mini-avatar{width:27px;height:27px;border-radius:50%;background:#e7edf7;display:grid;place-items:center;color:#566791;font-size:10px;font-weight:700}.modal-backdrop{position:fixed;inset:0;background:#18202d55;display:grid;place-items:center;padding:20px;z-index:20}.modal{background:white;border-radius:14px;width:min(500px,100%);box-shadow:0 25px 70px #10182840;overflow:hidden}.modal-head,.modal-foot{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modal-foot{border:0;border-top:1px solid var(--line);justify-content:flex-end;gap:8px}.modal-head b{font-size:15px}.modal-body{padding:20px;display:grid;gap:13px}.modal label{font-size:11px;color:#68727d;display:grid;gap:6px}.modal input,.modal textarea,.modal select{border:1px solid var(--line);border-radius:8px;padding:10px;color:var(--ink);background:#fff}.modal textarea{min-height:90px;resize:vertical}.toast{position:fixed;bottom:24px;right:24px;padding:12px 16px;background:#202a36;color:white;border-radius:9px;box-shadow:var(--shadow);z-index:30;font-size:12px}.hidden{display:none!important}.mobile-menu{display:none}
@media(max-width:1050px){.shell{grid-template-columns:210px 1fr}.stats{grid-template-columns:repeat(2,1fr)}.content{padding:26px 22px}.topbar{padding:0 22px}}
@media(max-width:720px){.shell{display:block}.sidebar{position:fixed;z-index:10;inset:0 auto 0 0;width:260px;transform:translateX(-102%);transition:transform .22s ease;box-shadow:10px 0 35px #1018281c}.sidebar.open{transform:translateX(0)}.mobile-menu{display:inline-grid}.topbar{height:58px;padding:0 15px}.content{padding:22px 15px 45px}.heading{gap:10px}.heading h1{font-size:21px}.row,.lower{grid-template-columns:1fr}.stats{gap:10px}.stat{padding:14px}.stat-value{font-size:22px}.search{width:140px}.heading .primary{white-space:nowrap}.demo{display:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
</style></head><body>
<div class="shell"><aside class="sidebar" id="sidebar"><div class="brand"><div class="logo">T</div><div><b>Talk Manager</b><small>Community operations</small></div></div><div class="server"><div class="server-icon">T</div><span><strong>Talk</strong><small>Discord server</small></span><span style="color:#98a1ab">⌄</span></div><div><div class="nav-label">Workspace</div><nav class="nav" id="nav"></nav></div><div class="side-bottom"><div class="nav-label">Workspace status</div><div style="display:flex;gap:8px;align-items:center;padding:7px 10px;color:#77818d;font-size:11px"><span style="width:7px;height:7px;border-radius:50%;background:#d59b32"></span> Demo mode · backend not connected</div><div class="user"><div class="avatar">G</div><div><strong>Guest workspace</strong><small>Local demo</small></div></div></div></aside><main class="main"><header class="topbar"><div style="display:flex;gap:12px;align-items:center"><button class="icon-button mobile-menu" id="menuBtn" aria-label="Open navigation">☰</button><div class="crumb">Talk <span style="padding:0 7px;color:#c0c5ca">/</span> <b id="crumb">Overview</b></div></div><div class="top-right"><span class="demo">DEMO DATA</span><button class="icon-button" id="helpBtn" aria-label="Help">?</button></div></header><section class="content" id="view"></section></main></div><div id="overlay"></div><div id="toasts"></div>
<script>
const navItems=[['Overview','◫'],['Server Members','♙'],['Moderation','⛨'],['Automations','⌘'],['Auto Advertise','↗'],['Social Accounts','◎'],['Community Growth','⌁'],['Analytics','▥'],['Welcome System','✳'],['Roles & Permissions','♧'],['Giveaways','◇'],['Events','◷'],['Logs & Audit Trail','≡'],['Integrations','⌘'],['Settings','⚙'],['Help & Diagnostics','?']];
let active='Overview';let campaigns=loadCampaigns();
function loadCampaigns(){try{const saved=JSON.parse(localStorage.getItem('talk-manager-campaigns'));if(Array.isArray(saved))return saved}catch{}return [{name:'October community invite',body:'A friendly invite to join the Talk community.',platform:'Discord',status:'Draft',date:'—',sample:true},{name:'Friday hangout',body:'Join us for a community hangout this Friday.',platform:'Discord',status:'Scheduled',date:'Oct 16, 18:00',sample:true}]}
function saveCampaigns(){try{localStorage.setItem('talk-manager-campaigns',JSON.stringify(campaigns))}catch{toast('Browser storage is unavailable; this change may not persist.')}}
const nav=document.querySelector('#nav');navItems.forEach(([name,icon])=>{const b=document.createElement('button');b.innerHTML=`<span class="ico">${icon}</span>${name}`;b.onclick=()=>go(name);nav.append(b)});
function go(name){active=name;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.textContent.trim()===name));document.querySelector('#crumb').textContent=name;document.querySelector('#sidebar').classList.remove('open');render()}
function header(title,sub,action=''){return `<div class="heading"><div><h1>${title}</h1><p>${sub}</p></div>${action}</div>`}
function cardHead(title,meta=''){return `<div class="card-head"><h2>${title}</h2><small>${meta}</small></div>`}
function render(){let v=document.querySelector('#view');if(active==='Overview')v.innerHTML=overview();else if(active==='Auto Advertise')v.innerHTML=campaignView();else if(active==='Server Members')v.innerHTML=membersView();else if(active==='Social Accounts')v.innerHTML=socialView();else if(active==='Help & Diagnostics'||active==='Integrations'||active==='Settings')v.innerHTML=setupView();else v.innerHTML=sectionView(active);bind();}
function overview(){return `${header('Good morning','Here’s what’s happening in Talk today.','<button class="btn primary" data-action="campaign">＋ New campaign</button>')}<div class="banner">You’re viewing a local demo. Numbers below are clearly marked sample data; connect Supabase and Discord to load live server information.</div><div class="grid stats"><article class="card stat"><div class="stat-label">Server members</div><div class="stat-value">2,481</div><div class="stat-note"><span class="up">↑ 3.8%</span> <span>sample · last 30 days</span></div></article><article class="card stat"><div class="stat-label">Joins this month</div><div class="stat-value">148</div><div class="stat-note">Sample data · joins minus leaves tracked separately</div></article><article class="card stat"><div class="stat-label">Moderation actions</div><div class="stat-value">12</div><div class="stat-note">Sample data · last 7 days</div></article><article class="card stat"><div class="stat-label">Scheduled campaigns</div><div class="stat-value">1</div><div class="stat-note">Local draft queue · no publishing connection</div></article></div><div class="grid row"><section class="card">${cardHead('Member growth','Sample · last 30 days')}<div class="chart-wrap"><svg class="chart" viewBox="0 0 600 185" preserveAspectRatio="none" role="img" aria-label="Sample member growth line chart"><defs><linearGradient id="fade" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#6874dc" stop-opacity=".18"/><stop offset="1" stop-color="#6874dc" stop-opacity="0"/></linearGradient></defs><path class="axis" d="M35 25H590M35 70H590M35 115H590M35 160H590"/><path class="area" d="M35 140 L90 128 L145 132 L200 108 L255 115 L310 88 L365 96 L420 64 L475 72 L530 43 L585 35 L585 160 L35 160Z"/><path class="line" d="M35 140 L90 128 L145 132 L200 108 L255 115 L310 88 L365 96 L420 64 L475 72 L530 43 L585 35"/><text class="chart-label" x="35" y="179">Sep 12</text><text class="chart-label" x="290" y="179">Sep 27</text><text class="chart-label" x="555" y="179">Oct 11</text></svg></div></section><section class="card">${cardHead('Connections','Live connection status')}<div class="status-row"><span class="status-symbol">✓</span><span>Discord bot</span><span class="pill neutral">Setup required</span></div><div class="status-row"><span class="status-symbol">✓</span><span>Supabase</span><span class="pill neutral">Setup required</span></div><div class="status-row"><span class="status-symbol">↗</span><span>Social publishing</span><span class="pill neutral">Not connected</span></div><div class="status-row"><span class="status-symbol">◷</span><span>Scheduled worker</span><span class="pill neutral">Not running</span></div></section></div><div class="grid lower"><section class="card">${cardHead('Recent activity','Sample activity')}<div class="activity"><div class="activity-item"><span class="dot green"></span><div><b>Welcome system configuration saved</b><p>Sample event · no server change made</p></div><time>10:42</time></div><div class="activity-item"><span class="dot"></span><div><b>Campaign draft created</b><p>October community invite · local only</p></div><time>09:18</time></div><div class="activity-item"><span class="dot amber"></span><div><b>Bot permissions need setup</b><p>Connect a Discord application to enable management</p></div><time>Yesterday</time></div></div></section><section class="card">${cardHead('Needs attention','Connection diagnostics')}<div class="activity"><div class="activity-item"><span class="dot amber"></span><div><b>Connect Supabase</b><p>Authentication and persistent storage are disabled.</p></div><button class="btn" data-goto="Integrations">Set up</button></div><div class="activity-item"><span class="dot amber"></span><div><b>Configure Discord bot</b><p>Privileged actions are unavailable in demo mode.</p></div><button class="btn" data-goto="Help & Diagnostics">Guide</button></div></div></section></div>`}
function campaignView(){return `${header('Auto Advertise','Create and manage community promotions. Posts stay local until an authorised connection is configured.','<button class="btn primary" data-action="campaign">＋ New campaign</button>')}<div class="banner">Publishing is disabled in this demo. Discord webhook delivery and supported provider APIs require server-side credentials. Manual copy workflow is available in each draft.</div><div class="card"><div class="card-head"><h2>Campaigns</h2><div class="toolbar"><input class="field search" id="campaignSearch" placeholder="Search campaigns…" aria-label="Search campaigns"><select class="field" id="campaignFilter"><option>All statuses</option><option>Draft</option><option>Scheduled</option></select></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Campaign</th><th>Platform</th><th>Status</th><th>Scheduled</th><th></th></tr></thead><tbody id="campaignRows">${campaignRows()}</tbody></table></div></div>`}
function campaignRows(){return campaigns.map((c,i)=>`<tr><td><b>${esc(c.name)}</b><span class="sub">${c.sample?'Sample draft':'Saved on this device'}</span></td><td>${esc(c.platform)}</td><td><span class="pill ${c.status==='Draft'?'neutral':''}">${esc(c.status)}</span></td><td>${esc(c.date)}</td><td><button class="btn" data-action="copy" data-id="${i}">Copy</button> <button class="btn" data-action="edit" data-id="${i}">Edit</button> <button class="btn" data-action="duplicate" data-id="${i}" aria-label="Duplicate ${esc(c.name)}">Duplicate</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty-note">No campaigns yet. Create a draft to get started.</td></tr>'}
function membersView(){return `${header('Server Members','Member data is unavailable until the Discord bot is connected.')}<div class="banner">Demo preview only. Search, roles, and moderation actions require a verified Discord connection and server-side permission checks.</div><div class="card"><div class="card-head"><h2>Members <small>· sample rows</small></h2><div class="toolbar"><input class="field search" id="memberSearch" placeholder="Search members…"><button class="btn" data-goto="Integrations">Connect Discord</button></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Member</th><th>Joined</th><th>Roles</th><th>Status</th></tr></thead><tbody id="members"><tr><td><div class="member"><span class="mini-avatar">AL</span><span><b>alex_l</b><span class="sub">Sample member</span></span></div></td><td>Oct 8, 2026</td><td>Member</td><td><span class="pill neutral">Demo</span></td></tr><tr><td><div class="member"><span class="mini-avatar">JM</span><span><b>julesm</b><span class="sub">Sample member</span></span></div></td><td>Oct 6, 2026</td><td>Member, Events</td><td><span class="pill neutral">Demo</span></td></tr><tr><td><div class="member"><span class="mini-avatar">RK</span><span><b>river_k</b><span class="sub">Sample member</span></span></div></td><td>Oct 4, 2026</td><td>Member</td><td><span class="pill neutral">Demo</span></td></tr></tbody></table></div></div>`}
function socialView(){const names=['Discord announcements','X','Facebook Pages','Instagram','TikTok','YouTube','Reddit'];return `${header('Social accounts','Connect authorised channels and review what each integration can do.')}<div class="banner">No provider credentials are configured. This screen never asks for social account passwords. Use each provider’s official OAuth or publishing setup.</div><div class="card">${names.map((x,i)=>`<div class="status-row"><span class="status-symbol" style="background:#f2f3f5;color:#69727e">${['D','𝕏','f','◎','♪','▶','r'][i]}</span><span><b>${x}</b><small style="display:block;color:#89939e;font-size:10px;margin-top:2px">${['Webhook announcements · message delivery','API access and posting permissions vary','Meta Page connection and app review may be required','Professional account and Meta permissions required','Authorised Content Posting API access required','YouTube Data API and channel authorisation required','OAuth access and subreddit rules apply'][i]}</small></span><span class="pill neutral">Setup required</span><button class="btn" data-goto="Integrations">Details</button></div>`).join('')}</div>`}
function setupView(){return `${header(active,'Configure service connections and review deployment requirements.')}<div class="banner">Values belong in your deployment environment or secret manager. Do not paste bot tokens or service-role keys into this page.</div><div class="grid row"><section class="card">${cardHead('Supabase','Authentication, database, and storage')}<div class="modal-body"><label>Project URL<input disabled placeholder="Set SUPABASE_URL in your environment"></label><label>Public / publishable key<input disabled placeholder="Set SUPABASE_ANON_KEY in your environment"></label><button class="btn" data-action="toast">View setup instructions</button></div></section><section class="card">${cardHead('Discord application','OAuth and bot connectivity')}<div class="modal-body"><p style="color:var(--muted);font-size:12px;margin:0">Configure OAuth secrets and bot credentials in the server environment. The bot should receive only the intents and permissions required for enabled features.</p><button class="btn" data-action="toast">View permission guide</button></div></section></div><section class="card" style="margin-top:16px">${cardHead('Deployment checklist','Setup required')}<div class="activity"><div class="activity-item"><span class="dot amber"></span><div><b>Supabase URL and anon key</b><p>Needed for sign-in and persistent application data.</p></div></div><div class="activity-item"><span class="dot amber"></span><div><b>Discord OAuth application and bot</b><p>OAuth callback plus bot service; never expose secrets to the browser.</p></div></div><div class="activity-item"><span class="dot amber"></span><div><b>Persistent worker</b><p>Needed for gateway events and reliable scheduled campaign execution.</p></div></div></div></section>`}
function sectionView(name){const map={'Moderation':['Review warnings, cases, and server actions.','Moderation records appear here after the Discord bot and secure API are configured. No moderation action is available in demo mode.'],'Automations':['Configure safe event triggers and scheduled work.','Automation rules are stored locally only in this preview. Connect Supabase and deploy the worker to run them.'],'Community Growth':['Understand joins, departures, and campaign attribution.','No source attribution is invented. Measured metrics will appear after data collection is configured.'],'Analytics':['Explore measured community trends.','Analytics will be populated from connected data. Export is enabled once real datasets are available.'],'Welcome System':['Configure and preview onboarding messages.','Welcome messages require a connected bot with permission to read join events and post in the selected channel.'],'Roles & Permissions':['Review Discord roles and application access.','Application access roles must be enforced by backend policies; no roles are editable in demo mode.'],'Giveaways':['Create transparent, auditable community giveaways.','Giveaway entry and winner selection require a connected bot and auditable server-side records.'],'Events':['Plan community events and reminders.','Events can be drafted after persistent storage is configured.'], 'Logs & Audit Trail':['Review administrative changes and task outcomes.','No real audit events have been recorded in this local demo.'],'Settings':['Manage workspace preferences and connections.','Connect backend services to enable persistent settings.']};let x=map[name]||['Configure your Talk workspace.','This feature requires a server connection.'];return `${header(name,x[0])}<div class="card blank"><div><div class="logo" style="margin:0 auto 15px">T</div><h3>${x[1].split('.')[0]}.</h3><p>${x[1]}</p><button class="btn" data-goto="Integrations">Open integrations</button></div></div>`}
function openCampaign(index=null){const old=index===null?null:campaigns[index];document.querySelector('#overlay').innerHTML=`<div class="modal-backdrop" id="backdrop"><form class="modal" id="campaignForm"><div class="modal-head"><b>${old?'Edit campaign':'New campaign draft'}</b><button type="button" class="icon-button" data-close>×</button></div><div class="modal-body"><label>Campaign title<input name="name" maxlength="80" required value="${esc(old?.name||'')}" placeholder="e.g. Friday community hangout"></label><label>Post text<textarea name="copy" maxlength="2000" placeholder="Write a clear, friendly invitation…">${esc(old?.body||'')}</textarea></label><label>Platform<select name="platform"><option>Discord</option><option>X · manual workflow</option><option>Instagram · manual workflow</option><option>Reddit · manual workflow</option></select></label><label>Schedule date and time<input type="datetime-local" name="date"></label><small style="color:var(--muted)">Saving creates a local draft. Scheduling and publishing require a connected backend and platform authorisation.</small></div><div class="modal-foot"><button type="button" class="btn" data-close>Cancel</button><button class="btn primary">Save draft</button></div></form></div>`;document.querySelector('#campaignForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),date=f.get('date');const item={name:f.get('name'),body:f.get('copy'),platform:f.get('platform'),status:'Draft',date:date?new Date(date).toLocaleString(): '—',sample:false};if(index!==null)campaigns[index]=item;else campaigns.unshift(item);saveCampaigns();closeModal();render();toast('Draft saved on this device.')};document.querySelector('[data-close]').onclick=closeModal;document.querySelector('#backdrop').onclick=e=>{if(e.target.id==='backdrop')closeModal()}}
function closeModal(){document.querySelector('#overlay').innerHTML=''}function toast(s){const el=document.createElement('div');el.className='toast';el.textContent=s;document.querySelector('#toasts').append(el);setTimeout(()=>el.remove(),2600)}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function bind(){document.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>go(b.dataset.goto));document.querySelectorAll('[data-action="campaign"]').forEach(b=>b.onclick=()=>openCampaign());document.querySelectorAll('[data-action="edit"]').forEach(b=>b.onclick=()=>openCampaign(+b.dataset.id));document.querySelectorAll('[data-action="duplicate"]').forEach(b=>b.onclick=()=>{const c=campaigns[+b.dataset.id];campaigns.unshift({...c,name:c.name+' (copy)',status:'Draft',date:'—',sample:false});saveCampaigns();render();toast('Campaign draft duplicated.')});document.querySelectorAll('[data-action="copy"]').forEach(b=>b.onclick=async()=>{const c=campaigns[+b.dataset.id];const copy=[c.name,c.body].filter(Boolean).join('\n\n');try{await navigator.clipboard.writeText(copy);toast('Campaign text copied. Add your invite link before sharing.')}catch{toast('Clipboard access unavailable.')}});document.querySelectorAll('[data-action="toast"]').forEach(b=>b.onclick=()=>toast('See README.md for setup steps.'));const s=document.querySelector('#campaignSearch');if(s)s.oninput=()=>{const q=s.value.toLowerCase();document.querySelector('#campaignRows').innerHTML=campaignRowsFiltered(q,document.querySelector('#campaignFilter').value);bindCampaignRows()};const f=document.querySelector('#campaignFilter');if(f)f.onchange=()=>{document.querySelector('#campaignRows').innerHTML=campaignRowsFiltered(s.value.toLowerCase(),f.value);bindCampaignRows()};const ms=document.querySelector('#memberSearch');if(ms)ms.oninput=()=>document.querySelectorAll('#members tr').forEach(r=>r.classList.toggle('hidden',!r.textContent.toLowerCase().includes(ms.value.toLowerCase())))}
function bindCampaignRows(){document.querySelectorAll('#campaignRows [data-action="copy"]').forEach(b=>b.onclick=async()=>{const c=campaigns[+b.dataset.id];try{await navigator.clipboard.writeText([c.name,c.body].filter(Boolean).join('\n\n'));toast('Campaign text copied. Add your invite link before sharing.')}catch{toast('Clipboard access unavailable.')}});document.querySelectorAll('#campaignRows [data-action="edit"]').forEach(b=>b.onclick=()=>openCampaign(+b.dataset.id));document.querySelectorAll('#campaignRows [data-action="duplicate"]').forEach(b=>b.onclick=()=>{const c=campaigns[+b.dataset.id];campaigns.unshift({...c,name:c.name+' (copy)',status:'Draft',date:'—',sample:false});saveCampaigns();render();toast('Campaign draft duplicated.')})}
function campaignRowsFiltered(q,status){return campaigns.map((c,i)=>({c,i})).filter(({c})=>(!q||c.name.toLowerCase().includes(q))&&(status==='All statuses'||c.status===status)).map(({c,i})=>`<tr><td><b>${esc(c.name)}</b><span class="sub">Community promotion</span></td><td>${esc(c.platform)}</td><td><span class="pill ${c.status==='Draft'?'neutral':''}">${esc(c.status)}</span></td><td>${esc(c.date)}</td><td><button class="btn" data-action="copy" data-id="${i}">Copy</button> <button class="btn" data-action="edit" data-id="${i}">Edit</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty-note">No matching campaigns.</td></tr>'}
document.querySelector('#menuBtn').onclick=()=>document.querySelector('#sidebar').classList.toggle('open');document.querySelector('#helpBtn').onclick=()=>go('Help & Diagnostics');go('Overview');
</script></body></html>
